<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Guardian Ghost Demo</title>

    <!-- React + ReactDOM + Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>


    <style>
      :root {
        --bg: #0b0f17;
        --panel: #0f1720;
        --muted: #94a3b8;
        --accent: #6ee7b7;
        --accent-2: #b392ff;
        --danger: #ff6b6b;
        --glass: rgba(255, 255, 255, 0.03);
      }

      html, body, #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: radial-gradient(1200px 600px at 10% 10%, rgba(179,146,255,0.05), transparent),
          radial-gradient(1200px 600px at 90% 90%, rgba(110,231,183,0.04), transparent),
          var(--bg);
        color: #e6eef8;
        font-family: "Hiragino Kaku Gothic ProN","Noto Sans JP","Inter",sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
.app-header {
  position: relative;
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(255, 255, 255, 0.02);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.lang-toggle {
  position: absolute;
  right: 16px;
  top: 10px;
  background: transparent;
  color: #e6eef8;
  border: none;
  font-size: 14px;
  cursor: pointer;
  padding: 6px 10px;
  transition: opacity 0.2s;
}
.lang-toggle:hover {
  opacity: 0.7;
}

.phone {
  width: 100%;
  max-width: 420px;
  height: 100%;
  max-height: 100vh;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  box-shadow: 0 10px 40px rgba(2,6,23,0.7);
  border: 1px solid rgba(255,255,255,0.03);
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  overflow: hidden;
  position: relative;
}
.screen.active {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}


      .ghost {
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

/* ---------- chat container ---------- */
.chat-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.chat {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; /* ✅ iPhone smooth scroll */
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  padding-bottom: 120px; /* ✅ make space for input bar */
  box-sizing: border-box;
  scroll-behavior: smooth;
}


/* each message row (wraps a bubble) */
.chat-message {
  display: flex;
  width: 100%;
  box-sizing: border-box;
  align-items: flex-start;
  margin: 0;              /* no extra margin that stacks vertically too much */
  padding: 0;
}

/* alignment helpers for left/right messages */
.chat-message.ghost { justify-content: flex-start; }
.chat-message.user  { justify-content: flex-end; }

/* ---------- bubble visual ---------- */
/* Use block layout so width control works reliably */
.bubble {
display: inline-block;    
 max-width: 85%;  
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  word-break: break-word;
  white-space: pre-wrap;  /* ✅ allows proper wrapping, no cut */
  overflow-wrap: break-word;
  margin-bottom: 6px;
  background: rgba(128, 90, 213, 0.15);
  color: #fff;
}



/* differentiate left / right but avoid extra stacking behavior */
.bubble.ghost {
  align-self: flex-start;
  background: rgba(179,146,255,0.95);
  color: #071322;
  border-bottom-left-radius: 8px;
  border-bottom-right-radius: 18px;
}

.bubble.user {
  align-self: flex-end;
  background: rgba(255,255,255,0.95);
  color: #071322;
  border-bottom-right-radius: 8px;
  border-bottom-left-radius: 18px;
}

/* long messages: only scroll inside if very tall */
.bubble.long {
  max-height: 220px;     /* allow taller text but cap height */
  overflow-y: auto;
  padding-right: 8px;    /* room for scrollbar */
  scrollbar-width: thin;
}

/* ✅ input area fixed but above keyboard */
/* ✅ input area fixed above keyboard & not overlapping messages */
.input-area {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 420px;
  background: rgba(20, 20, 30, 0.95);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-sizing: border-box;
  border-top: 1px solid rgba(255,255,255,0.1);
}

/* ensure the input itself grows */
input.msg {
  flex: 1;
  background: transparent;
  border: none;
  color: #e6eef8;
  font-size: 15px;
  padding: 8px;
  outline: none;
}

/* send button */
button.send {
  background: var(--accent-2);
  color: #071322;
  border: none;
  padding: 8px 12px;
  border-radius: 999px;
  font-weight: 700;
  cursor: pointer;
}

/* small helper so avatar/ghost stays above the chat area */
.phone .ghost { margin-bottom: 6px; }

      @keyframes pop {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      .screen { display: none; text-align: center; animation: fadeIn 1.5s ease-in-out; }
      .active { display: block; }

      button {
        background: white; color: black; border: none;
        padding: 15px 30px; font-size: 1.1em;
        border-radius: 10px; cursor: pointer; transition: 0.3s; margin-top: 15px;
      }
      button:hover { background: #222; color: white; border: 1px solid white; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .bubble.long::-webkit-scrollbar {
  width: 5px;
}
.bubble.long::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
}

      
@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
  100% { transform: translateY(0); }
}

@keyframes blink {
  0%, 90%, 100% { opacity: 1; }
  95% { opacity: 0.6; }
}

#email-screen input:focus {
  outline: none;
  border: 2px solid #b392ff;
  box-shadow: 0 0 8px rgba(179,146,255,0.6);
  transition: 0.2s;
}

#email-screen {
  animation: fadeIn 0.6s ease-in-out;
}

.input-area.inactive {
  opacity: 0.4;
  pointer-events: none;
}


    </style>
  </head>

  <body>
    <!-- スタートメニュー画面 -->
    <div id="start-screen" class="screen active">
      <h1> Guardian Ghost</h1>
      <p>ようこそ。ゴーストに会う準備はできた？</p>
      <button id="scanButton">スキャンモードを開始</button>
    </div>

    <!-- QRスキャンモード（仮の画面） -->
    <div id="scan-screen" class="screen">
      <h1>🔍 スキャンモード</h1>
      <div id="qr-reader" style="width: 260px; margin: 20px auto;"></div>

<p id="qr-result"></p>

      <button id="goToGhost">ゴーストの世界へ</button>
    </div>

    <!-- ゴーストアプリ本体 -->
    <div id="ghost-app" class="screen">
      <div id="root"></div>
    </div>
<!-- メール登録画面 -->
<div id="email-screen" class="screen">
  <h1>📧 メール通知を登録</h1>
  <input type="email" id="emailInput" placeholder="メールアドレスを入力" style="padding:10px;width:80%;max-width:300px;border-radius:8px;border:none;margin-top:10px;">
  <br/>
  <button id="registerEmailBtn">登録</button>
  <br/>
  <button id="backToChat">戻る</button>
</div>


    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const DICT = {
        ja: {
          title: "Guardian Ghost",
          welcome: "ようこそ Guardian Ghost へ",
          placeholder: "メッセージを入力…",
          english: "English",
          japanese: "日本語",
          timeUp: "時間だ…また会おうね👻",
          remaining: "残り時間",
        },
        en: {
          title: "Guardian Ghost",
          welcome: "Welcome to Guardian Ghost",
          placeholder: "Type a message…",
          english: "English",
          japanese: "日本語",
          timeUp: "My time is up... see you soon 👻",
          remaining: "Time left",
        },
      };

      const PERSONALITIES = {
        kind: {
          system: "You are a kind guardian ghost.",
          replies: [
            "大丈夫、私はここにいるよ 🌙",
            "焦らないで、ゆっくりでいいんだよ。",
            "あなたはよく頑張ってるね 💫",
          ],
          color: "rgba(179, 146, 255, 0.85)",
        },
       cool: {
  system: "You are a stylish, chill ghost with a mysterious charm.",
  replies: [
    "Yo, what's up? 😎",
    "まぁ、焦んなって。",
    "夜風が気持ちいいな…お前もそう思うだろ？🌙",
  ],
  color: "rgba(173,216,230,0.9)", // 水色系
},

      };

     function GhostSVG({ personality }) {
  const isKind = personality === "kind";

  // それぞれの色と表情を変える
  const bodyColor = isKind  ? "rgba(255,255,255,0.8)" // kind：透けた白
    : "rgba(173,216,230,0.8)"; // cool：薄い青

  const eyeColor = isKind ? "#0a0a0a" : "#001a33";
  const mouthStyle = isKind
    ? "M50,78 Q64,88 78,78" // kind：にっこり
    : "M50,80 L78,80"; // cool：まっすぐ

  return (
    <div
      className="ghost"
      style={{
        backgroundColor: "transparent",
        display: "flex",
        justifyContent: "center",
        alignItems: "center",
        animation: isKind ? "float 3s ease-in-out infinite" : "blink 5s linear infinite",
      }}
    >
      <svg viewBox="0 0 128 128" width="84" height="84">
       <path
  fill={bodyColor}
  d="
    M64 8
    c-22 0-40 18-40 40
    v40
    c0 0 5-6 10-4
    s6 6 10 4
    s8-8 14-5
    s6 9 10 5
    s7-7 12-3
    s5 7 10 4
    c5-3 8 4 8 4
    v-45
    c0-22-18-40-40-40z
  "
/>

        <circle cx="46" cy="56" r="6" fill={eyeColor} />
        <circle cx="82" cy="56" r="6" fill={eyeColor} />
<rect x="36" y="54" width="22" height="12" rx="3" fill="rgba(0,0,0,0.6)" /> {/* 左目のサングラス */}
<rect x="70" y="54" width="22" height="12" rx="3" fill="rgba(0,0,0,0.6)" /> {/* 右目のサングラス */}
<line x1="58" y1="60" x2="70" y2="60" stroke="rgba(0,0,0,0.6)" strokeWidth="2" /> {/* フレーム */}
        <path d={mouthStyle} stroke={eyeColor} strokeWidth="3" fill="none" />
      </svg>
    </div>
  );
}


      function App({ personality }) {
        const [lang, setLang] = useState("ja");
        const t = DICT[lang];
        const [messages, setMessages] = useState([{ from: "ghost", text: t.welcome }]);
        const [input, setInput] = useState("");
        const [timeLeft, setTimeLeft] = useState(15 * 60);
        const [active, setActive] = useState(true);
        const chatRef = useRef(null);

        useEffect(() => { setMessages([{ from: "ghost", text: DICT[lang].welcome }]); }, [lang]);
        useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [messages]);

        useEffect(() => {
          if (!active) return;
          const timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setActive(false);
                setMessages(prev => [...prev, { from: "ghost", text: t.timeUp }]);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(timer);
        }, [active, lang]);

        const sendMessage = async () => {
          if (!input || !active) return;
          const userMsg = input;
          setMessages(prev => [...prev, { from: "user", text: userMsg }]);
          setInput("");

          try {
            const response = await fetch("https://guardian-ghost.onrender.com/chat", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ message: userMsg, personality: PERSONALITIES[personality].system }),
});
const data = await response.json();
setMessages(prev => [...prev, { from: "ghost", text: data.reply }]);

                    } catch (err) {
            setMessages(prev => [
              ...prev,
              { from: "ghost", text: "Connection lost... I can’t reach my world 👻" },
            ]);
          }
        };

        const formatTime = (seconds) => {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
        };

        return (
          <div className="phone">
           <header className="app-header">
  <div style={{ fontWeight: 700, fontSize: 16 }}>{t.title}</div>

  {/* 📧 メールアイコン追加部分 */}
  <div style={{ position: "absolute", right: "60px", top: "10px" }}>
    <button
      style={{ background: "transparent", border: "none", color: "#e6eef8", fontSize: "20px", cursor: "pointer" }}
      onClick={() => {
        document.getElementById("ghost-app").classList.remove("active");
        document.getElementById("email-screen").classList.add("active");
      }}
    >
      📧
    </button>
  </div>

  <button className="lang-toggle" onClick={() => setLang(lang === "ja" ? "en" : "ja")}>
    {lang === "ja" ? t.english : t.japanese}
  </button>
</header>

           <main className="chat-screen">
              <div style={{ textAlign: "center", fontSize: 13, color: "#94a3b8" }}>
                {t.remaining}: {formatTime(timeLeft)}
              </div>
         <div style={{ textAlign: "center", margin: "4px 0 4px 0" }}>
<GhostSVG personality={personality} />
</div>

<div className="chat" ref={chatRef}>
  {messages.map((m, i) => (
    <div key={i} className={`chat-message ${m.from}`}>
      <div className={`bubble ${m.from}`}>{m.text}</div>
    </div>
  ))}
</div>

            <div className={`input-area ${!active ? "inactive" : ""}`}>

                <input
                  className="msg"
                  value={input}
                  placeholder={t.placeholder}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && sendMessage()}
                  disabled={!active}
                />
                <button className="send" onClick={sendMessage} disabled={!active}>→</button>
              </div>
            </main>
          </div>
        );
      }

      // ✅ Start app and render with selected personality
      let selectedPersonality = "kind"; // default
let qrReader;


     document.getElementById("scanButton").addEventListener("click", () => {
  document.getElementById("start-screen").classList.remove("active");
  document.getElementById("scan-screen").classList.add("active");

  // ✅ 少し待ってから startQR() 実行
  setTimeout(() => {
    startQR();
  }, 500); // ← 0.5秒待機（これで #qr-reader が確実に描画される）
});


   

  function startQR() {
    const qrResult = document.getElementById("qr-result");
    qrReader = new Html5Qrcode("qr-reader");

    qrReader.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 200 },
      (decodedText) => {
        qrReader.stop();

        qrResult.innerText = `Scanned: ${decodedText}`;


        if (decodedText.includes("kind")) {
          selectedPersonality = "kind";
        } else if (decodedText.includes("cool")) {
          selectedPersonality = "cool";
        } else {
          selectedPersonality = "kind";
        }

        alert(`選ばれた性格: ${selectedPersonality}`);

        document.getElementById("scan-screen").classList.remove("active");
        document.getElementById("ghost-app").classList.add("active");

        setTimeout(() => startApp(), 300);
      },
      (errorMessage) => {
        // console.log("QR scanning...", errorMessage);
      }
    );
  }

  // ✅ Reactが確実にDOMを読み込んでから起動
 

     function startApp() {
  const rootEl = document.getElementById("root");
  if (!rootEl) {
    console.error("Root element not found!");
    return;
  }
  ReactDOM.createRoot(rootEl).render(
    <App personality={selectedPersonality} />
  );
}
// Auto-detect long messages
function adjustBubbleHeight() {
  document.querySelectorAll(".bubble").forEach(bubble => {
    if (bubble.scrollHeight > 200) {
      bubble.classList.add("long");
    }
  });
}
setInterval(adjustBubbleHeight, 500);


      // Keep chat scrolled to bottom automatically
function scrollToBottom() {
  const chat = document.querySelector(".chat");
  if (chat) chat.scrollTop = chat.scrollHeight;
}

const chat = document.querySelector(".chat");
if (chat) {
  const observer = new MutationObserver(scrollToBottom);
  observer.observe(chat, { childList: true });
}

window.addEventListener("focusin", scrollToBottom);
window.addEventListener("resize", scrollToBottom);

 // メール登録画面の戻るボタン動作
  document.getElementById("backToChat").addEventListener("click", () => {
    document.getElementById("email-screen").classList.remove("active");
    document.getElementById("ghost-app").classList.add("active");
  });

  // メール登録ボタンの仮動作（今はアラートで確認）
  document.getElementById("registerEmailBtn").addEventListener("click", () => {
    const email = document.getElementById("emailInput").value.trim();
    if (!email) {
      alert("メールアドレスを入力してください。");
      return;
    }
    alert("登録完了: " + email + " 👻");
    document.getElementById("email-screen").classList.remove("active");
    document.getElementById("ghost-app").classList.add("active");
  });

    </script>
  </body>
</html>
